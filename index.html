
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2><span class="x">X</span> <span class="o">O</span>
            Tic-Tac-Toe</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#game">Play</a>
            <a href="#rules">Rules</a>
        </nav>
    </header>

    <main id="home">
        <section class="hero">
            <p class="eyebrow">THE CLASSIC, REIMAGINED</p>
            <h1>Think. Place. <span>Win!</span></h1>
        </section>

        <section id="game" class="game-container">
            <div class="game-panel">
                <div class="game-heading">
                    <h2>Neon Arena</h2>
                    <p id="status">Player X's turn</p>
                </div>

                <div class="board" id="board">
                    <button class="cell" data-index="0"></button>
                    <button class="cell" data-index="1"></button>
                    <button class="cell" data-index="2"></button>
                    <button class="cell" data-index="3"></button>
                    <button class="cell" data-index="4"></button>
                    <button class="cell" data-index="5"></button>
                    <button class="cell" data-index="6"></button>
                    <button class="cell" data-index="7"></button>
                    <button class="cell" data-index="8"></button>
                </div>

                <p id="result" aria-live="polite"></p>

                <div class="controls">
                    <button id="new-game">New Game</button>
                </div>
            </div>

            <aside class="side-panel">
                <h3>Scoreboard</h3>
                <p>Player X: <strong id="scoreX">0</strong></p>
                <p>Player O: <strong id="scoreO">0</strong></p>
                <p>Draws: <strong id="draws">0</strong></p>
                <button id="reset-scores">Reset Scores</button>

                <h3 id="rules">Quick Rules</h3>
                <p>Get three marks in a row, column, or diagonal to win.</p>
            </aside>
        </section>
    </main>

    <footer>Made with <span>♥</span> for game lovers</footer>

    <script src="script.js"></script>
</body>
</html>
